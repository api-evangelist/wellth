  reason: no-machine-readable-spec
  detail: >-
    Wellth runs a real production GraphQL API at api.wellthapp.com/graphql — its own
    status page lists a "Wellth API" component — but Apollo Server introspection is
    disabled in production (INTROSPECTION_DISABLED), there is no developer portal or
    reference documentation anywhere on wellthapp.com, and every other path on the
    API host answers 200 with the plain-text stub "Please use the /graphql route for
    access to useful data", so no schema, operation list or auth model can be read
    by any anonymous machine.
