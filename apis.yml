apis:
- aid: wellth:graphql
  name: Wellth GraphQL API
  description: 'The production GraphQL API behind the Wellth member mobile app and
    the Wellth internal dashboard. Confirmed live at https://api.wellthapp.com/graphql:
    the endpoint is an Apollo Server deployment (stack traces reference an internal
    apiv4 application) that validates queries against a real Query type and enforces
    Apollo CSRF prevention. GraphQL introspection is explicitly disabled in production
    (INTROSPECTION_DISABLED), so no SDL could be captured, and Wellth publishes no
    public schema, reference documentation or developer portal for it. Listed as a
    named component ("Wellth API") on the company status page.'
