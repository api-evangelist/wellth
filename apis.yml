aid: wellth
name: Wellth
description: 'Wellth is a digital health company that applies behavioral economics
  to care-plan adherence for health plans and providers. Members use the Wellth mobile
  app to complete daily check-ins — photographing medications, logging blood pressure
  or glucose readings, confirming appointments and screenings — and earn financial
  rewards for staying on plan. Wellth sells into Medicare Advantage and D-SNP, Medicaid,
  ACA marketplace, employer and provider lines of business, and reports reductions
  in high-cost utilization, emergency department visits and readmissions. The company
  operates a production GraphQL API at api.wellthapp.com/graphql (Apollo Server, internally
  versioned apiv4) that backs the member mobile app and its internal dashboard, and
  publishes an Atlassian status page whose components include "Wellth API". The API
  is not accompanied by a public developer portal, reference documentation or machine-readable
  contract, and GraphQL introspection is disabled in production.'
